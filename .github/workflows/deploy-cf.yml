# ============================================================
#  Stelarith · Cloudflare Pages 全栈部署（方案 B · 云侧节点）
#  触发：push 到 main 分支 / 手动触发
#  需在 GitHub Secrets 配置：
#    CLOUDFLARE_API_TOKEN  （Cloudflare API 令牌，Pages:Edit 权限）
#    CLOUDFLARE_ACCOUNT_ID （Cloudflare 账户 ID）
# ============================================================
name: Deploy to Cloudflare Pages (Fullstack)

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "pages/**"
      - "components/**"
      - "composables/**"
      - "server/**"
      - "nuxt.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare fullstack mode)
        run: npm run build:cf

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name stelarith --branch main
